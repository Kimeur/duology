<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="The four ways people hold iPhone Duo and what Duology does in each: closed, open, book and tabletop.">
  <rect width="1200" height="330" rx="16" fill="#f7f8fa"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- closed -->
    <rect x="105" y="40" width="90" height="130" rx="16" fill="#ffffff" stroke="#141a26" stroke-width="3"/>
    <rect x="182" y="70" width="5" height="70" rx="2" fill="#2b55c7"/>
    <rect x="117" y="56" width="58" height="98" rx="6" fill="#e9edf4"/>
    <text x="150" y="210" font-size="20" font-weight="700" fill="#141a26">Closed</text>
    <text x="150" y="236" font-size="14" fill="#5b6475">compact width</text>
    <text x="150" y="258" font-size="14" fill="#5b6475">one pane, bars on the side</text>

    <!-- open -->
    <rect x="345" y="50" width="210" height="120" rx="16" fill="#ffffff" stroke="#141a26" stroke-width="3"/>
    <rect x="359" y="64" width="84" height="92" rx="6" fill="#e9edf4"/>
    <rect x="457" y="64" width="84" height="92" rx="6" fill="#2b55c7"/>
    <path d="M450 58V162" stroke="#2b55c7" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="450" y="210" font-size="20" font-weight="700" fill="#141a26">Open</text>
    <text x="450" y="236" font-size="14" fill="#5b6475">regular width</text>
    <text x="450" y="258" font-size="14" fill="#5b6475">two panes or reflowed grid</text>

    <!-- book -->
    <path d="M660 70L740 50L740 170L660 150Z" fill="#e9edf4" stroke="#141a26" stroke-width="3" stroke-linejoin="round"/>
    <path d="M740 50L820 70L820 150L740 170Z" fill="#ffffff" stroke="#141a26" stroke-width="3" stroke-linejoin="round"/>
    <text x="740" y="210" font-size="20" font-weight="700" fill="#141a26">Book</text>
    <text x="740" y="236" font-size="14" fill="#5b6475">fold is a divider</text>
    <text x="740" y="258" font-size="14" fill="#5b6475">nothing tappable on it</text>

    <!-- tabletop -->
    <path d="M950 60H1110L1110 120H950Z" fill="#2b55c7" stroke="#141a26" stroke-width="3" stroke-linejoin="round"/>
    <path d="M950 120H1110L1130 170H930Z" fill="#ffffff" stroke="#141a26" stroke-width="3" stroke-linejoin="round"/>
    <text x="1030" y="210" font-size="20" font-weight="700" fill="#141a26">Tabletop</text>
    <text x="1030" y="236" font-size="14" fill="#5b6475">watch on top</text>
    <text x="1030" y="258" font-size="14" fill="#5b6475">touch controls below</text>
  </g>
  <text x="600" y="306" font-family="Menlo, Consolas, monospace" font-size="14" fill="#5b6475" text-anchor="middle">/duo-poses runs your app in each of these and screenshots it</text>
</svg>
