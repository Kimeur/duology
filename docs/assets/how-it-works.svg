<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How Duology works: you ask Claude Code, Duology skills guide the code, Xcode 27.1 builds it, duo-lint and the pose check verify it, then it ships.">
  <rect width="1200" height="300" rx="16" fill="#f7f8fa"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6475"/></marker>
  </defs>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="90" width="180" height="120" rx="12" fill="#ffffff" stroke="#c9d0dc" stroke-width="2"/>
    <text x="120" y="138" font-size="20" font-weight="700" fill="#141a26">You ask</text>
    <text x="120" y="166" font-size="15" fill="#5b6475">"Make my app</text>
    <text x="120" y="186" font-size="15" fill="#5b6475">great on Duo"</text>

    <rect x="260" y="70" width="210" height="160" rx="12" fill="#2b55c7"/>
    <text x="365" y="122" font-size="20" font-weight="700" fill="#ffffff">Claude Code</text>
    <text x="365" y="150" font-size="15" fill="#dbe4ff">+ Duology skills</text>
    <text x="365" y="176" font-size="15" fill="#dbe4ff">patterns · poses</text>
    <text x="365" y="198" font-size="15" fill="#dbe4ff">recipes · iOS 27</text>

    <rect x="520" y="90" width="190" height="120" rx="12" fill="#ffffff" stroke="#c9d0dc" stroke-width="2"/>
    <text x="615" y="138" font-size="20" font-weight="700" fill="#141a26">Xcode 27.1</text>
    <text x="615" y="166" font-size="15" fill="#5b6475">mcpbridge</text>
    <text x="615" y="186" font-size="15" fill="#5b6475">Device Hub</text>

    <rect x="760" y="90" width="190" height="120" rx="12" fill="#ffffff" stroke="#c9d0dc" stroke-width="2"/>
    <text x="855" y="138" font-size="20" font-weight="700" fill="#141a26">Checks</text>
    <text x="855" y="166" font-size="15" fill="#5b6475">duo-lint</text>
    <text x="855" y="186" font-size="15" fill="#5b6475">every pose, screenshot</text>

    <rect x="1000" y="90" width="170" height="120" rx="12" fill="#ffffff" stroke="#c9d0dc" stroke-width="2"/>
    <text x="1085" y="138" font-size="20" font-weight="700" fill="#141a26">Ship</text>
    <text x="1085" y="166" font-size="15" fill="#5b6475">screenshots</text>
    <text x="1085" y="186" font-size="15" fill="#5b6475">App Review notes</text>
  </g>
  <g stroke="#5b6475" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M212 150H254"/><path d="M472 150H514"/><path d="M712 150H754"/><path d="M952 150H994"/>
  </g>
  <path d="M855 214V256H365V236" stroke="#5b6475" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="610" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6475" text-anchor="middle">a failed check goes back to Claude with the screenshot and the rule it broke</text>
</svg>
